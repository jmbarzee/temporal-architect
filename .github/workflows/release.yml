name: Release

# Orchestrator. Triggered by every `v*` tag push.
#
# After the distribution split the toolchain is a pure release-cutter: it builds
# primitive artifacts and publishes the canonical GitHub Release, then dispatches
# to the distribution repo (jmbarzee/temporal-architect-dist), which downloads
# those assets and publishes every registry package.
#
# All real work is in per-phase reusable workflows:
#   _release-guard.yml           — assert the tag is valid and its commit is on main
#   _build-binaries.yml          — matrix builds the twf binary archives
#   _build-skills-tarball.yml    — package skills/ as a release asset
#   _build-artifacts.yml         — visualizer lib + wire-types tarballs
#   _publish-npm-libs.yml        — publish the two libraries to npm (OIDC + provenance)
#   _publish-github-release.yml  — checksums + GitHub Release with all assets
#   _dispatch-dist.yml           — hand off to the dist repo (first run: credential check)
#
# This file is thin: declare the dependency graph and pass the dist-app secret.
# The toolchain publishes its own libraries (wire-types, visualizer); every
# end-user consumption model is published from the distribution repo.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Pre-flight ───────────────────────────────────────────────────────────

  release-guard:
    uses: ./.github/workflows/_release-guard.yml
    with:
      version: ${{ github.ref_name }}

  dist-credential:
    # Mint the dist-handoff token before anything publishes, so a broken
    # credential fails the release here rather than after it has shipped.
    uses: ./.github/workflows/_dispatch-dist.yml
    secrets:
      DIST_APP_PRIVATE_KEY: ${{ secrets.DIST_APP_PRIVATE_KEY }}

  # ── Build (artifacts the Release ships) ──────────────────────────────────

  build-binaries:
    needs: [release-guard, dist-credential]
    uses: ./.github/workflows/_build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  build-skills-tarball:
    needs: [release-guard, dist-credential]
    uses: ./.github/workflows/_build-skills-tarball.yml
    with:
      version: ${{ github.ref_name }}

  build-artifacts:
    needs: [release-guard, dist-credential]
    uses: ./.github/workflows/_build-artifacts.yml
    with:
      version: ${{ github.ref_name }}

  # ── Fan out per-module Go tags (additive; nothing depends on it) ─────────

  tag-modules:
    # Fan vX.Y.Z out into path-prefixed module tags for go get/install.
    # Additive — nothing depends on it, so a failure can't break publishing.
    needs: [release-guard, dist-credential]
    uses: ./.github/workflows/_tag-modules.yml
    with:
      version: ${{ github.ref_name }}

  # ── Publish the toolchain's own libraries to npm ─────────────────────────

  publish-npm-libs:
    # Libraries (wire-types, visualizer) publish from the repo that owns their
    # identity. OIDC trusted publishing + provenance; id-token:write is required
    # here and in the reusable workflow.
    needs: build-artifacts
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_publish-npm-libs.yml
    with:
      version: ${{ github.ref_name }}

  # ── Cut the canonical GitHub Release ─────────────────────────────────────

  publish-github-release:
    needs: [build-binaries, build-skills-tarball, build-artifacts]
    uses: ./.github/workflows/_publish-github-release.yml
    with:
      version: ${{ github.ref_name }}

  # ── Hand off to the distribution repo ────────────────────────────────────

  dispatch-dist:
    # Fires only after the Release (and its assets) exist and npm serves the
    # libraries, so dist can download the assets and install the visualizer's
    # wire-types dependency immediately. Lockstep is automatic: dist stamps the
    # incoming version into its manifests and never tags independently.
    needs: [publish-github-release, publish-npm-libs]
    uses: ./.github/workflows/_dispatch-dist.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      DIST_APP_PRIVATE_KEY: ${{ secrets.DIST_APP_PRIVATE_KEY }}
