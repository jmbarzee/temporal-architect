name: CI

on:
  pull_request:
    branches: [main, "visualizer/**"]
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lsp/go.mod

      - run: make vet
      - run: make test

      - name: Verify command reference is up to date
        run: make check-docs

      - name: Verify generated wire types are up to date
        run: make check-types

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/lsp/go.mod

      - name: Install dependencies
        run: cd tools/visualizer && npm ci

      - name: Typecheck visualizer
        run: make typecheck

      - name: Verify visualizer
        run: make verify-visualizer

      - name: Build toolchain (binary + the two npm libraries)
        run: make build

      - name: Verify release artifacts pack
        run: |
          make pack-visualizer-lib
          make pack-wire-types

  corpus:
    name: Corpus (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [go, python, typescript, dotnet, java, ruby, clojure, rust, php, perl, elixir, swift, haskell]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: corpus/go.mod
          cache-dependency-path: |
            corpus/go.sum
            tools/lsp/go.sum

      - uses: actions/setup-node@v4
        if: matrix.sdk == 'typescript'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: corpus/package-lock.json

      - uses: astral-sh/setup-uv@v10.3.3
        if: matrix.sdk == 'python'
        with:
          enable-cache: true
          cache-dependency-glob: corpus/uv.lock

      - uses: actions/setup-dotnet@v5
        if: matrix.sdk == 'dotnet'
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: corpus/packages.lock.json

      - uses: actions/setup-java@v4
        if: matrix.sdk == 'java' || matrix.sdk == 'clojure'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: |
            corpus/pom.xml
            corpus/pom-clojure.xml

      - uses: ruby/setup-ruby@v1.338.0
        if: matrix.sdk == 'ruby'
        with:
          working-directory: corpus
          bundler-cache: true

      # Perl: sdk-perl is not on CPAN, so its dists and native libraries (sdk-core
      # via cargo) build from pinned checkouts; the tests run against a dev server.
      - uses: actions/checkout@v4
        if: matrix.sdk == 'perl'
        with:
          repository: MasonEgger/sdk-perl
          ref: 55816a1b279acd17f1e994047533b04a60e9d05d
          path: .perl/sdk-perl
      - uses: actions/checkout@v4
        if: matrix.sdk == 'perl'
        with:
          repository: temporalio/sdk-rust
          ref: v0.4.0
          path: .perl/sdk-rust
          submodules: recursive
      - uses: actions/checkout@v4
        if: matrix.sdk == 'perl'
        with:
          repository: MasonEgger/protobuf-perl
          ref: 008677c8864e56ea6e9b2a1ade0bda1c47bd4def
          path: .perl/protobuf-perl
      - uses: actions/cache@v4
        if: matrix.sdk == 'perl'
        with:
          path: |
            ~/.cargo/registry
            .perl/sdk-rust/target
            .perl/sdk-perl/ext/temporalio-perl-bridge/target
          key: corpus-perl-cargo-55816a1-v0.4.0-008677c
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.sdk == 'perl'
      - uses: shogo82148/actions-setup-perl@v1
        if: matrix.sdk == 'perl'
        with:
          perl-version: "5.38"
          install-modules-with: cpanm
          working-directory: corpus
      - uses: temporalio/setup-temporal@v0
        if: matrix.sdk == 'perl'
      - if: matrix.sdk == 'perl'
        run: sudo apt-get install -y -q protobuf-compiler    # sdk-core's build needs protoc
      - if: matrix.sdk == 'perl'
        run: corpus/perl-lib/install-sdk.sh .perl

      # No protoc: the client's vendored-protox feature compiles the protos in-process.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.sdk == 'rust'
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        if: matrix.sdk == 'rust'
        with:
          workspaces: corpus

      - uses: erlef/setup-beam@v1
        if: matrix.sdk == 'elixir'
        with:
          otp-version: '28'
          elixir-version: '1.19.7'

      - uses: actions/cache@v4
        if: matrix.sdk == 'elixir'
        with:
          path: |
            corpus/deps
            corpus/_build
          key: corpus-elixir-${{ hashFiles('corpus/mix.lock') }}

      # Elixir's SDK has no test server: its tests run against a dev server, with time skipping on.
      - uses: temporalio/setup-temporal@v0
        if: matrix.sdk == 'elixir'
        with:
          version: '1.9.1'

      - if: matrix.sdk == 'elixir'
        timeout-minutes: 2
        run: |
          temporal server start-dev --headless --dynamic-config-value frontend.WorkflowTimeSkippingEnabled=true &
          until temporal operator cluster health; do sleep 1; done

      - uses: shivammathur/setup-php@v2
        if: matrix.sdk == 'php'
        with:
          php-version: '8.4'
          extensions: grpc, sockets, curl
          tools: composer:v2

      # setup-swift verifies Swiftly against swift.org's signing keys, which the runner lacks.
      # swift-keys.asc is https://www.swift.org/keys/all-keys.asc; refresh it when swift.org adds a signing key.
      - if: matrix.sdk == 'swift'
        run: gpg --import .github/swift-keys.asc
      - uses: swift-actions/setup-swift@v3.0.0-beta.1
        if: matrix.sdk == 'swift'
        with:
          swift-version: '6.2.3'

      - uses: actions/cache@v4
        if: matrix.sdk == 'swift'
        with:
          path: corpus/.build
          key: swift-${{ runner.os }}-${{ hashFiles('corpus/Package.resolved') }}

      # The runner's cargo builds the SDK's Rust bridge; protoc is for proto-lens-protobuf-types' Setup.
      - uses: haskell-actions/setup@v2
        if: matrix.sdk == 'haskell'
        id: ghc
        with:
          ghc-version: 9.10.3
          cabal-version: 3.16.1.0

      - if: matrix.sdk == 'haskell'
        run: sudo apt-get install -y protobuf-compiler

      - uses: actions/cache@v4
        if: matrix.sdk == 'haskell'
        with:
          path: |
            ${{ steps.ghc.outputs.cabal-store }}
            corpus/dist-newstyle
            corpus/.hs-temporal-sdk/core/rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: corpus-haskell-${{ hashFiles('corpus/cabal.project*', 'corpus/corpus.cabal', 'Makefile') }}
          restore-keys: corpus-haskell-

      - run: make corpus-${{ matrix.sdk }}
        env:
          GITHUB_TOKEN: ${{ github.token }} # dload's GitHub API calls (rr, test server)
