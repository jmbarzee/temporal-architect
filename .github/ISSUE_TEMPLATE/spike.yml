name: Spike
description: A question to settle before the work that depends on it — Task-sized. Its deliverable is a decision, not a diff.
title: "Spike: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `issues` skill](https://github.com/metacensus/skills/blob/main/skills/issues/SKILL.md).

        Attach this to its parent after filing (`gh issue edit THIS --parent EPIC`).

  - type: textarea
    id: question
    attributes:
      label: Question
      description: One sentence, answerable.
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each with the evidence that would decide it.
    validations:
      required: true
