name: Epic
title: "Epic: "
description: Weeks of work, held as Tasks.
labels: ["needs-triage", "epic"]
body:
  - type: markdown
    attributes:
      value: |
        Conventions: [the `issues` skill](https://github.com/metacensus/skills/blob/main/skills/issues/SKILL.md).

        Children are sub-issues (`gh issue edit N --parent THIS`), not a list in the body.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence — what is true when every child has closed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
    validations:
      required: true
