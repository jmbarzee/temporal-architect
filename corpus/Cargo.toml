# The Rust corpus: one Cargo workspace. Each design's rust/ directory is a member
# crate; this root package is the shared time-skipping test environment.
[workspace]
members = ["*/rust"]
exclude = [".hs-temporal-sdk"] # the Haskell SDK clone, whose Rust bridge is its own workspace
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
temporalio-sdk = { version = "=1.1.2", features = ["experimental"] }
temporalio-client = { version = "=1.1.2", features = ["vendored-protox", "experimental"] }
temporalio-common = "=1.1.2"
temporalio-macros = "=1.1.2"
temporalio-workflow = "=1.1.2"
futures = "0.3"
temporalio-sdk-core = { version = "=0.10.2", features = ["ephemeral-server"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
tonic = "0.14"
corpus-testkit = { path = "." }

[package]
name = "corpus-testkit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "testkit.rs"

[dependencies]
temporalio-sdk.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-sdk-core.workspace = true
tokio.workspace = true
tonic.workspace = true
