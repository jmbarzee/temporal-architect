version: "3"

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: "php worker.php"

temporal:
  address: ${TEMPORAL_ADDRESS:-127.0.0.1:7233}
  activities:
    num_workers: 2

logs:
  mode: production
  level: warn

# WorkflowTestCase clears its activity mocks in this store after every test.
kv:
  test:
    driver: memory
    config:
      interval: 10
