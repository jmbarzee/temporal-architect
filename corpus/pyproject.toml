[project]
name = "temporal-architect-corpus"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "temporalio==1.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.uv]
package = false

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
